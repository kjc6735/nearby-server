# 부하테스트 중 서버·DB 상태를 수집한다. k6 결과는 InfluxDB에 따로 쌓인다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'nearby-app'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'app'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
